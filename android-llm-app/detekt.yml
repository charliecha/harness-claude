# detekt configuration for android-llm-app
# Aligns with .harness/rules/kotlin.md

build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    threshold: 110
  LongParameterList:
    functionThreshold: 6
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInObjects: 15
    thresholdInInterfaces: 15

style:
  active: true
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false

naming:
  active: true
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|t)'

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
